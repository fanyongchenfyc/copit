<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620">
  <defs>
    <!-- Gradients for feature maps -->
    <linearGradient id="grad_blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="40%" stop-color="#90CAF9"/>
      <stop offset="60%" stop-color="#FFCDD2"/>
      <stop offset="100%" stop-color="#E53935"/>
    </linearGradient>
    <linearGradient id="grad_purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E57C2"/>
      <stop offset="50%" stop-color="#EDE7F6"/>
      <stop offset="100%" stop-color="#CE93D8"/>
    </linearGradient>
    <!-- Gamma gradient -->
    <linearGradient id="grad_gamma" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BBDEFB"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <!-- Beta gradient -->
    <linearGradient id="grad_beta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="100%" stop-color="#E53935"/>
    </linearGradient>
    <!-- Activation colorbar -->
    <linearGradient id="grad_activation" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="50%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#E53935"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow_small" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="620" fill="white"/>

  <!-- ===== Input Feature Map F_{i,c} (bottom) ===== -->
  <!-- Top face -->
  <polygon points="165,455 180,440 340,440 325,455" fill="#CFD8DC" stroke="#78909C" stroke-width="0.8"/>
  <!-- Right face -->
  <polygon points="325,455 340,440 340,370 325,385" fill="#B0BEC5" stroke="#78909C" stroke-width="0.8"/>
  <!-- Front face with gradient -->
  <rect x="165" y="385" width="160" height="70" fill="url(#grad_blue)" rx="1" filter="url(#shadow)"/>
  <rect x="165" y="385" width="160" height="70" fill="none" stroke="#546E7A" stroke-width="1" rx="1"/>
  <!-- Label -->
  <text x="245" y="425" font-family="serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" style="paint-order:stroke;stroke:#333;stroke-width:0.5px">F<tspan font-size="12" dy="3">i,c</tspan></text>

  <!-- ===== Arrow from input upward ===== -->
  <line x1="245" y1="385" x2="245" y2="355" stroke="#37474F" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- ===== Element-wise Multiplication (⊙) ===== -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#37474F"/>
    </marker>
  </defs>
  <circle cx="245" cy="340" r="16" fill="white" stroke="#37474F" stroke-width="1.8"/>
  <circle cx="245" cy="340" r="3" fill="#37474F"/>

  <!-- ===== Gamma vector ===== -->
  <rect x="40" y="310" width="90" height="38" fill="url(#grad_gamma)" rx="3" filter="url(#shadow_small)"/>
  <rect x="40" y="310" width="90" height="38" fill="none" stroke="#1565C0" stroke-width="0.8" rx="3"/>
  <!-- Gamma color strips -->
  <g transform="translate(48, 318)">
    <rect x="0" y="0" width="5" height="12" fill="#E3F2FD" rx="0.5"/>
    <rect x="6" y="0" width="5" height="12" fill="#BBDEFB" rx="0.5"/>
    <rect x="12" y="0" width="5" height="12" fill="#90CAF9" rx="0.5"/>
    <rect x="18" y="0" width="5" height="12" fill="#64B5F6" rx="0.5"/>
    <rect x="24" y="0" width="5" height="12" fill="#42A5F5" rx="0.5"/>
    <rect x="30" y="0" width="5" height="12" fill="#2196F3" rx="0.5"/>
    <rect x="36" y="0" width="5" height="12" fill="#1E88E5" rx="0.5"/>
    <rect x="42" y="0" width="5" height="12" fill="#1976D2" rx="0.5"/>
    <rect x="48" y="0" width="5" height="12" fill="#1565C0" rx="0.5"/>
    <rect x="54" y="0" width="5" height="12" fill="#0D47A1" rx="0.5"/>
  </g>
  <text x="85" y="343" font-family="serif" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">γ<tspan font-size="10" dy="2">i,c</tspan></text>

  <!-- Arrow from gamma to multiplication -->
  <path d="M130,329 Q170,310 228,340" fill="none" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrow_blue)"/>
  <defs>
    <marker id="arrow_blue" markerWidth="7" markerHeight="5" refX="3.5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#1565C0"/>
    </marker>
  </defs>

  <!-- ===== Middle Feature Map (scaled) ===== -->
  <!-- Top face -->
  <polygon points="165,260 180,245 340,245 325,260" fill="#E8EAF6" stroke="#78909C" stroke-width="0.8"/>
  <!-- Right face -->
  <polygon points="325,260 340,245 340,175 325,190" fill="#C5CAE9" stroke="#78909C" stroke-width="0.8"/>
  <!-- Front face with gradient -->
  <rect x="165" y="190" width="160" height="70" fill="url(#grad_purple)" rx="1" filter="url(#shadow)"/>
  <rect x="165" y="190" width="160" height="70" fill="none" stroke="#546E7A" stroke-width="1" rx="1"/>

  <!-- ===== Arrow from multiplication to middle ===== -->
  <line x1="245" y1="324" x2="245" y2="262" stroke="#37474F" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- ===== Arrow from middle to addition ===== -->
  <line x1="245" y1="190" x2="245" y2="160" stroke="#37474F" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- ===== Element-wise Addition (⊕) ===== -->
  <circle cx="245" cy="145" r="16" fill="white" stroke="#37474F" stroke-width="1.8"/>
  <line x1="245" y1="133" x2="245" y2="157" stroke="#37474F" stroke-width="1.8"/>
  <line x1="233" y1="145" x2="257" y2="145" stroke="#37474F" stroke-width="1.8"/>

  <!-- ===== Beta vector ===== -->
  <rect x="40" y="115" width="90" height="38" fill="url(#grad_beta)" rx="3" filter="url(#shadow_small)"/>
  <rect x="40" y="115" width="90" height="38" fill="none" stroke="#E53935" stroke-width="0.8" rx="3"/>
  <!-- Beta color strips -->
  <g transform="translate(48, 123)">
    <rect x="0" y="0" width="5" height="12" fill="#FFCDD2" rx="0.5"/>
    <rect x="6" y="0" width="5" height="12" fill="#EF9A9A" rx="0.5"/>
    <rect x="12" y="0" width="5" height="12" fill="#E57373" rx="0.5"/>
    <rect x="18" y="0" width="5" height="12" fill="#EF5350" rx="0.5"/>
    <rect x="24" y="0" width="5" height="12" fill="#F44336" rx="0.5"/>
    <rect x="30" y="0" width="5" height="12" fill="#E53935" rx="0.5"/>
    <rect x="36" y="0" width="5" height="12" fill="#D32F2F" rx="0.5"/>
    <rect x="42" y="0" width="5" height="12" fill="#C62828" rx="0.5"/>
    <rect x="48" y="0" width="5" height="12" fill="#B71C1C" rx="0.5"/>
    <rect x="54" y="0" width="5" height="12" fill="#880E4F" rx="0.5"/>
  </g>
  <text x="85" y="148" font-family="serif" font-size="14" font-weight="bold" fill="#E53935" text-anchor="middle">β<tspan font-size="10" dy="2">i,c</tspan></text>

  <!-- Arrow from beta to addition -->
  <path d="M130,134 Q170,115 228,145" fill="none" stroke="#E53935" stroke-width="1.5" marker-end="url(#arrow_red)"/>
  <defs>
    <marker id="arrow_red" markerWidth="7" markerHeight="5" refX="3.5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#E53935"/>
    </marker>
  </defs>

  <!-- ===== Arrow from addition to output ===== -->
  <line x1="245" y1="129" x2="245" y2="99" stroke="#37474F" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- ===== Output Feature Map (top) ===== -->
  <!-- Top face -->
  <polygon points="165,65 180,50 340,50 325,65" fill="#ECEFF1" stroke="#78909C" stroke-width="0.8"/>
  <!-- Right face -->
  <polygon points="325,65 340,50 340,-20 325,-5" fill="#CFD8DC" stroke="#78909C" stroke-width="0.8"/>
  <!-- Front face with gradient -->
  <rect x="165" y="-5" width="160" height="70" fill="url(#grad_blue)" rx="1" filter="url(#shadow)"/>
  <rect x="165" y="-5" width="160" height="70" fill="none" stroke="#546E7A" stroke-width="1" rx="1"/>

  <!-- ===== Input/Output arrows ===== -->
  <!-- Top output arrow -->
  <line x1="245" y1="-5" x2="245" y2="-30" stroke="#37474F" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <!-- Bottom input arrow -->
  <line x1="245" y1="455" x2="245" y2="480" stroke="#37474F" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- ===== FiLM Bracket ===== -->
  <line x1="22" y1="65" x2="22" y2="385" stroke="#37474F" stroke-width="2.5"/>
  <line x1="22" y1="65" x2="32" y2="65" stroke="#37474F" stroke-width="2.5"/>
  <line x1="22" y1="385" x2="32" y2="385" stroke="#37474F" stroke-width="2.5"/>
  <!-- FiLM label -->
  <text x="12" y="225" font-family="sans-serif" font-size="18" font-weight="bold" fill="#37474F" text-anchor="middle" transform="rotate(-90, 12, 225)">FiLM</text>

  <!-- ===== Activation Color Bar ===== -->
  <rect x="95" y="530" width="200" height="16" fill="url(#grad_activation)" rx="2"/>
  <rect x="95" y="530" width="200" height="16" fill="none" stroke="#78909C" stroke-width="0.8" rx="2"/>
  <text x="85" y="542" font-family="serif" font-size="11" fill="#455A64" text-anchor="end" font-style="italic">activation</text>
  <text x="90" y="557" font-family="serif" font-size="11" fill="#455A64" text-anchor="middle">−</text>
  <text x="300" y="557" font-family="serif" font-size="11" fill="#455A64" text-anchor="middle">+</text>

</svg>
